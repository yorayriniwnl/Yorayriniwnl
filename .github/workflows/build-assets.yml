name: Build generated assets

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "data/profile.json"
      - "scripts/generate_assets.py"
      - "scripts/redline.py"
      - "design/yor-tokens.json"
      - "scripts/generate_motion.py"
      - "scripts/generate_readme.py"
      - "scripts/optimize_assets.py"
      - "scripts/profile_data.py"
      - "scripts/fonts/**"
      - "assets/**"
      - "tests/**"
      - "requirements-profile.txt"
      - ".github/workflows/build-assets.yml"
  pull_request:
    paths:
      - "README.md"
      - "data/profile.json"
      - "scripts/**"
      - "assets/**"
      - "tests/**"
      - "requirements-profile.txt"
      - ".github/workflows/build-assets.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-output
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (source)
        uses: actions/checkout@v4
        with:
          path: main

      - name: Reject oversized new source artwork
        if: github.event_name == 'pull_request'
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python - <<'PY'
          import subprocess
          from pathlib import Path

          base = "origin/${{ github.base_ref }}"
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=AM", f"{base}...HEAD", "--", "assets"],
              text=True,
          ).splitlines()

          limit = 4 * 1024 * 1024
          violations = []
          for name in changed:
              path = Path(name)
              if not path.is_file():
                  continue
              size = path.stat().st_size
              if size > limit:
                  violations.append(f"{name}: {size} bytes")

          assert not violations, (
              "New or modified source artwork over 4 MiB must be optimized or moved "
              "to a release/artifact store before merge:\n" + "\n".join(violations)
          )
          print(f"Checked {len(changed)} changed asset files")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: main/requirements-profile.txt

      - name: Install profile build dependencies
        run: python -m pip install -r main/requirements-profile.txt

      - name: Validate canonical data and optimized artwork
        working-directory: main
        run: |
          python scripts/profile_data.py
          python scripts/optimize_assets.py
          git diff --exit-code -- assets

      - name: Generate profile visuals
        run: |
          python main/scripts/generate_assets.py
          python main/scripts/generate_motion.py

      - name: Generate public resume PDF
        working-directory: main
        run: python scripts/generate_public_resume.py

      - name: Verify README and all profile contracts
        working-directory: main
        run: |
          python scripts/generate_readme.py --check
          python -m unittest discover -s tests -v

      - name: Checkout output (generated artifacts)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: output
          path: output

      - name: Sync generated files into output branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          find output -maxdepth 1 -type f -name '*.svg' \
            ! -name 'stats.svg' \
            ! -name 'stats-mobile.svg' \
            ! -name 'contribution-stream.svg' \
            ! -name 'contribution-stream-mobile.svg' \
            -delete
          cp main/generated/*.svg output/
          cp main/generated/systems-reel*.gif output/
          cp main/generated/systems-reel*-still.png output/
          cp main/output/pdf/Ayush_Roy_Resume_Public.pdf output/Ayush_Roy_Resume_Public.pdf

      - name: Commit if changed
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          repository: output
          commit_message: "chore: regenerate profile visual assets"
          branch: output