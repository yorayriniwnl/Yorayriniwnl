name: Build stats cards

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch: {}     # manual "run now" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "data/profile.json"
      - "scripts/generate_stats.py"
      - "scripts/redline.py"
      - "design/yor-tokens.json"
      - "scripts/fonts/**"
      - "scripts/profile_data.py"
      - ".github/workflows/build-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-output
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (source)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live data + render stat cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main/scripts/generate_stats.py

      - name: Checkout output (generated artifacts)
        uses: actions/checkout@v4
        with:
          ref: output
          path: output

      - name: Copy generated card into output branch
        run: cp main/generated/stats*.svg output/

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          repository: output
          commit_message: "chore: refresh stats cards"
          branch: output
