name: Refresh contribution stream

on:
  schedule:
    - cron: "31 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate_contributions.py"
      - "scripts/redline.py"
      - "design/yor-tokens.json"
      - "scripts/profile_data.py"
      - "scripts/fonts/**"
      - "data/profile.json"
      - ".github/workflows/contribution-stream.yml"

permissions:
  contents: write

concurrency:
  group: profile-output
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Fetch public contribution calendar and render owned animation
        run: python main/scripts/generate_contributions.py

      - name: Checkout output (generated artifacts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: output
          path: output

      - name: Publish contribution stream
        run: cp main/generated/contribution-stream*.svg output/

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          repository: output
          commit_message: "chore: refresh contribution stream"
          branch: output
